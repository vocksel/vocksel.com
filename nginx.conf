server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro builds each page as <route>/index.html, so try the path, then the
    # directory, then a matching .html file before giving up.
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
